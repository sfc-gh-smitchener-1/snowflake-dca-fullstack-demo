# ────────────────────────────────────────────────────────────────────────────
# Default deployment — BOTH backends loaded.
#
# This spec runs the API container AND a Neo4j sidecar so that the demo can
# showcase Cypher-powered graph traversal alongside Snowflake-native recursive
# CTEs. The API selects backends via the GRAPH_BACKEND env var:
#
#   GRAPH_BACKEND=snowflake   Snowflake-native only (sidecar idle)
#   GRAPH_BACKEND=neo4j       Neo4j only
#   GRAPH_BACKEND=both        Both — every route accepts ?backend=...
#
# For a lighter / cheaper deployment without the Neo4j sidecar, use the
# alternative spec at: service-spec.snowflake-only.yaml
#
# See docs/GRAPH_BACKENDS.md for the compare/contrast and decision matrix.
# ────────────────────────────────────────────────────────────────────────────

spec:
  containers:
    - name: ontology-graph-api
      image: /DCA_DEMO/GOVERNANCE/ONTOLOGY_GRAPH_REPO/ontology-graph-api:latest
      resources:
        requests:
          memory: 1Gi
          cpu: "0.5"
        limits:
          memory: 2Gi
          cpu: "1"
      readinessProbe:
        port: 8080
        path: /health
      env:
        SNOWFLAKE_ACCOUNT: "{{snowflake.account}}"
        SNOWFLAKE_HOST: "{{snowflake.host}}"
        # GRAPH_BACKEND: snowflake | neo4j | both  (default: both — see above)
        GRAPH_BACKEND: "both"
        NEO4J_URI: "bolt://localhost:7687"
        NEO4J_USER: "neo4j"
        NEO4J_PASSWORD: "ontology-graph"
    - name: neo4j
      image: /DCA_DEMO/GOVERNANCE/ONTOLOGY_GRAPH_REPO/neo4j-community:latest
      resources:
        requests:
          memory: 2Gi
          cpu: "1"
        limits:
          memory: 4Gi
          cpu: "2"
      readinessProbe:
        port: 7687
        path: /
      env:
        NEO4J_AUTH: "neo4j/ontology-graph"
        NEO4J_PLUGINS: '[]'
        NEO4J_server_memory_heap_initial__size: "512m"
        NEO4J_server_memory_heap_max__size: "1G"
        NEO4J_server_memory_pagecache_size: "512m"
  endpoints:
    - name: ontology-api
      port: 8080
      public: true
  computePool: RAI_COMPUTE_POOL
