# ────────────────────────────────────────────────────────────────────────────
# Lighter deployment — Snowflake-native backend ONLY (no Neo4j sidecar).
#
# Use this when:
#   - You want a smaller SPCS footprint (single container)
#   - You don't need Cypher / GDS-class algorithms in this engagement
#   - You want the demo story to be "no extra moving parts" (e.g. healthcare)
#   - The compute pool is cost-constrained
#
# To switch from the default (both backends) to this one:
#
#   ALTER SERVICE DCA_DEMO.GOVERNANCE.ONTOLOGY_GRAPH_SERVICE
#     FROM SPECIFICATION_FILE='ontology/spcs/service-spec.snowflake-only.yaml';
#
# All inference endpoints continue to work; ?backend=neo4j requests will
# return 400 with a clear error explaining the sidecar isn't loaded.
# See docs/GRAPH_BACKENDS.md.
# ────────────────────────────────────────────────────────────────────────────

spec:
  containers:
    - name: ontology-graph-api
      image: /DCA_DEMO/GOVERNANCE/ONTOLOGY_GRAPH_REPO/ontology-graph-api:latest
      resources:
        requests:
          memory: 512Mi
          cpu: "0.25"
        limits:
          memory: 1Gi
          cpu: "0.5"
      readinessProbe:
        port: 8080
        path: /health
      env:
        SNOWFLAKE_ACCOUNT: "{{snowflake.account}}"
        SNOWFLAKE_HOST: "{{snowflake.host}}"
        GRAPH_BACKEND: "snowflake"
  endpoints:
    - name: ontology-api
      port: 8080
      public: true
  computePool: RAI_COMPUTE_POOL
