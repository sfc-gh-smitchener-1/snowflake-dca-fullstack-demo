name: salesforce_ontology
description: >-
  Cortex Analyst semantic model for the SALESFORCE ontology, generated
  from mappings/salesforce.py. One logical table per ontology class, backed by
  the GOLD.V_SFDC_* views.
tables:
  - name: sfdc_account
    description: SALESFORCE Account
    base_table:
      database: ONT_DEMO
      schema: GOLD
      table: V_SFDC_ACCOUNT
    primary_key:
      columns:
        - uid
    dimensions:
      - name: uid
        expr: uid
        data_type: text
      - name: label
        expr: label
        data_type: text
      - name: name
        expr: name
        data_type: text
      - name: account_type
        expr: account_type
        data_type: text
      - name: address_locality
        expr: address_locality
        data_type: text
      - name: address_region
        expr: address_region
        data_type: text
      - name: customer_segment
        expr: customer_segment
        data_type: text
      - name: industry
        expr: industry
        data_type: text
      - name: rating
        expr: rating
        data_type: text
      - name: telephone
        expr: telephone
        data_type: text
      - name: url
        expr: url
        data_type: text
    facts:
      - name: annual_revenue
        expr: annual_revenue
        data_type: number
      - name: number_of_employees
        expr: number_of_employees
        data_type: number
  - name: sfdc_contact
    description: SALESFORCE Contact
