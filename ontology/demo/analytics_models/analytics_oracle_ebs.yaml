name: oracle_ontology
description: >-
  Cortex Analyst semantic model for the ORACLE ontology, generated
  from mappings/oracle.py. One logical table per ontology class, backed by
  the GOLD.V_ORA_* views.
tables:
  - name: ora_party
    description: ORACLE Party
    base_table:
      database: ONT_DEMO
      schema: GOLD
      table: V_ORA_PARTY
    primary_key:
      columns:
        - uid
    dimensions:
      - name: uid
        expr: uid
        data_type: text
      - name: label
        expr: label
        data_type: text
      - name: name
        expr: name
        data_type: text
      - name: address_locality
        expr: address_locality
        data_type: text
      - name: address_region
        expr: address_region
        data_type: text
      - name: category_code
        expr: category_code
        data_type: text
      - name: duns_number
        expr: duns_number
        data_type: text
      - name: party_type
        expr: party_type
        data_type: text
      - name: status
        expr: status
        data_type: text
  - name: ora_supplier
    description: ORACLE Supplier
    base_table:
      database: ONT_DEMO
      schema: GOLD
      table: V_ORA_SUPPLIER
    primary_key:
      columns:
        - uid
    dimensions:
      - name: uid
        expr: uid
        data_type: text
      - name: label
        expr: label
        data_type: text
      - name: name
        expr: name
        data_type: text
      - name: enabled_flag
        expr: enabled_flag
        data_type: text
      - name: payment_method
        expr: payment_method
        data_type: text
      - name: vendor_number
        expr: vendor_number
        data_type: text
      - name: vendor_type
        expr: vendor_type
        data_type: text
  - name: ora_inventory_item
    description: ORACLE InventoryItem
    base_table:
      database: ONT_DEMO
      schema: GOLD
      table: V_ORA_INVENTORYITEM
    primary_key:
      columns:
        - uid
    dimensions:
      - name: uid
        expr: uid
        data_type: text
      - name: label
        expr: label
        data_type: text
      - name: name
        expr: name
        data_type: text
      - name: item_number
        expr: item_number
        data_type: text
      - name: item_type
        expr: item_type
        data_type: text
      - name: primary_uom
        expr: primary_uom
        data_type: text
    facts:
      - name: list_price
        expr: list_price
        data_type: number
      - name: unit_weight
        expr: unit_weight
        data_type: number
  - name: ora_sales_order
    description: ORACLE SalesOrder
    base_table:
      database: ONT_DEMO
      schema: GOLD
      table: V_ORA_SALESORDER
    primary_key:
