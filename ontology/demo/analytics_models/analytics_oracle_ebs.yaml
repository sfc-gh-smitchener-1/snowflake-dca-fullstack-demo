        expr: uid
        data_type: text
      - name: label
        expr: label
        data_type: text
      - name: name
        expr: name
        data_type: text
      - name: booked_flag
        expr: booked_flag
        data_type: text
      - name: currency
        expr: currency
        data_type: text
      - name: flow_status
        expr: flow_status
        data_type: text
      - name: order_number
        expr: order_number
        data_type: text
      - name: ordered_date
        expr: ordered_date
        data_type: text
      - name: sold_to_party_uid
        expr: sold_to_party_uid
