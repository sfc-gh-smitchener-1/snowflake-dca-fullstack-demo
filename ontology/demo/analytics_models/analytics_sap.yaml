      - name: account_group
        expr: account_group
        data_type: text
      - name: address_locality
        expr: address_locality
        data_type: text
      - name: country
        expr: country
        data_type: text
      - name: email
        expr: email
        data_type: text
  - name: sap_purchase_order
    description: SAP PurchaseOrder
    base_table:
      database: ONT_DEMO
