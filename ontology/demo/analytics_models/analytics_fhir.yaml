        expr: name
        data_type: text
      - name: loinc_code
        expr: loinc_code
        data_type: text
      - name: status
        expr: status
        data_type: text
      - name: unit
        expr: unit
        data_type: text
      - name: subject_uid
        expr: subject_uid
        data_type: text
    facts:
