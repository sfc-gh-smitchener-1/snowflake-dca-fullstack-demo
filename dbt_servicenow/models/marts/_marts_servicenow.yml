version: 2

models:
  # ── Dimensions ──────────────────────────────────────────────────────────

  - name: dim_user
    description: >
      ServiceNow user dimension — agents, requesters, and managers.
      This model is the dbt-managed equivalent of the Dynamic Table
      CURATED_DEV.SERVICENOW.DIM_USER, demonstrating how dbt can own
      a source system domain within the DCA architecture.
    meta:
      owner: "ITSM Team"
      data_classification: CONFIDENTIAL
      contains_pii: true
    columns:
      - name: user_key
        description: Primary key — user sys_id
        tests:
          - not_null
          - unique
      - name: email
        description: User email address (PII — apply MASK_EMAIL policy)
        meta:
          pii_type: DIRECT
          governance: [MASK_EMAIL]
      - name: phone
        description: User phone number (PII — apply MASK_PHONE policy)
        meta:
          pii_type: DIRECT
          governance: [MASK_PHONE]

  - name: dim_cmdb_ci
    description: >
      CMDB Configuration Item dimension — IT assets and infrastructure.
      Covers servers, workstations, network devices, applications, and
      other managed infrastructure tracked in ServiceNow.
    meta:
      owner: "ITSM Team"
      data_classification: INTERNAL
    columns:
      - name: ci_key
        description: Primary key — CI sys_id
        tests:
          - not_null
          - unique
      - name: ci_class
        description: CI type classification (cmdb_ci_server, cmdb_ci_computer, etc.)
        tests:
          - not_null

  # ── Facts ───────────────────────────────────────────────────────────────

  - name: fact_incidents
    description: >
      Incident fact table with SLA breach detection and assignee enrichment.
      Key ITSM metric table — tracks service disruptions, resolution times,
      and SLA compliance. The is_sla_breached column is computed by dbt
      based on priority-specific thresholds (P1=4hr, P2=8hr, P3=24hr, P4=72hr).
    meta:
      owner: "ITSM Team"
      data_classification: INTERNAL
      sla_freshness: "1 hour"
    columns:
      - name: incident_key
        description: Primary key — incident sys_id
        tests:
          - not_null
          - unique
      - name: incident_number
        description: Human-readable incident number (INC0000001)
        tests:
          - not_null
          - unique
      - name: caller_key
        description: Foreign key to dim_user (who reported the incident)
        tests:
          - relationships:
              to: ref('dim_user')
              field: user_key
              severity: warn
      - name: is_sla_breached
        description: >
          Whether the incident exceeded its priority-based SLA target.
          Computed by dbt — this is an example of business logic that
          benefits from dbt's testability and version control.
        tests:
          - not_null

  - name: fact_changes
    description: >
      Change request fact table — tracks planned IT service changes
      with risk assessment and assignee context.
    meta:
      owner: "ITSM Team"
      data_classification: INTERNAL
    columns:
      - name: change_key
        description: Primary key — change request sys_id
        tests:
          - not_null
          - unique

  - name: fact_problems
    description: >
      Problem management fact table — root cause investigations
      for recurring incidents.
    meta:
      owner: "ITSM Team"
      data_classification: INTERNAL
    columns:
      - name: problem_key
        description: Primary key — problem sys_id
        tests:
          - not_null
          - unique

  - name: fact_requests
    description: >
      Service catalog request fact table — user-initiated service
      requests with requester context.
    meta:
      owner: "ITSM Team"
      data_classification: INTERNAL
    columns:
      - name: request_key
        description: Primary key — request sys_id
        tests:
          - not_null
          - unique
