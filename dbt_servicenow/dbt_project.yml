# ============================================================================
# dbt Project: ServiceNow ITSM Pipeline
# ============================================================================
#
# This dbt project manages the ServiceNow ITSM data pipeline within the
# Snowflake DCA Full Stack Demo. It demonstrates how dbt can coexist with
# Dynamic Tables — dbt owns the ServiceNow domain while Dynamic Tables
# handle the other five source systems (SAP, Salesforce, Oracle, FHIR, Workday).
#
# Architecture:
#   RAW_DEV.SERVICENOW (source)  →  staging models  →  marts (dim/fact)
#   Managed by: dbt (this project)
#   Other systems: Managed by Dynamic Tables (05_curated_layer.sql)
#
# ============================================================================

name: 'dbt_servicenow'
version: '1.0.0'
config-version: 2

profile: 'dbt_servicenow'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# ============================================================================
# Model Configuration
# ============================================================================
# Staging models: views (lightweight, always current)
# Marts models: tables (materialized for performance)
#
# This mirrors the Dynamic Tables pattern:
#   Dynamic Tables = Snowflake-managed materialization + refresh
#   dbt tables     = dbt-managed materialization via `dbt run`

models:
  dbt_servicenow:
    staging:
      +materialized: view
      +schema: DBT_SERVICENOW_STAGING
      +tags: ['servicenow', 'staging']
    marts:
      +materialized: table
      +schema: DBT_SERVICENOW
      +tags: ['servicenow', 'marts']
      dimensions:
        +materialized: table
        +tags: ['dimension']
      facts:
        +materialized: table
        +tags: ['fact']

# ============================================================================
# Variables
# ============================================================================

vars:
  source_database: 'RAW_DEV'
  source_schema: 'SERVICENOW'
